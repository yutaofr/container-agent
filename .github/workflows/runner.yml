name: runner

on:
  push:
    paths: ["runner/**", ".github/workflows/runner.yml"]
  pull_request:
    paths: ["runner/**", ".github/workflows/runner.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
