[project]
name = "cagent-platform"
version = "0.1.0"
description = "Container Agent platform: catalog, generator, orchestrator"
requires-python = ">=3.12"
dependencies = [
    "jsonpatch>=1.33",
    "langgraph>=1.2",
    "packaging>=24",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "websockets>=14",
]

[project.scripts]
cagent-gen = "cagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
