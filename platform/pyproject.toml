[project]
name = "cagent-platform"
version = "0.1.0"
description = "Container Agent platform: catalog, generator, orchestrator"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "jsonpatch>=1.33",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "litellm>=1.106",
    "packaging>=24",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
    "websockets>=14",
]

[project.scripts]
cagent-gen = "cagent.cli:main"
cagent-platform = "cagent.server:main"
cagent-eval = "cagent.eval.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright-asyncio>=0.10.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
