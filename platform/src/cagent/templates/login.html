{% extends "base.html" %}
{% block title %}Log in · cagent{% endblock %}
{% block main %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% if csrf %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Access token <input type="password" name="token" autocomplete="off" required></label>
  <button type="submit">Log in</button>
</form>
{% endif %}
{% endblock %}
