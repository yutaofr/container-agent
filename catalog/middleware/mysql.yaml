name: mysql
kind: middleware
provides: { capability: mysql }
image: "mysql:{version}"
versions: ["8.0", "8.4"]
default_version: "8.4"
port: 3306
# Throwaway prototype credentials; clusters never hold real data.
connection:
  db: app
  user: app
  password: app
env:
  MYSQL_DATABASE: "{{db}}"
  MYSQL_USER: "{{user}}"
  MYSQL_PASSWORD: "{{password}}"
  MYSQL_ROOT_PASSWORD: root
healthcheck:
  # TCP to 127.0.0.1 fails while the entrypoint's init server runs with skip-networking,
  # so the check turns healthy only once the real server accepts connections.
  # The password comes from the container's environment: a command never holds a secret.
  cmd: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u{{user}} -p\"$MYSQL_PASSWORD\" --silent"]
presets:
  tiny: { mem_limit: 512m, cpus: 0.5 }
  standard: { mem_limit: 1g, cpus: 1.0 }
# Init scripts run as root in the app database; cagent.init records each script by content.
init:
  env: [MYSQL_ROOT_PASSWORD]
  scripts:
    suffix: .sql
    run: mysql -h{{host}} -uroot -p"$MYSQL_ROOT_PASSWORD" {{db}} < "$file"
    marked: mysql -h{{host}} -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT 1 FROM cagent.init WHERE sha='$sha'" 2>/dev/null | grep -q 1
    mark: mysql -h{{host}} -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS cagent; CREATE TABLE IF NOT EXISTS cagent.init (sha CHAR(64) PRIMARY KEY); INSERT INTO cagent.init VALUES ('$sha')"
